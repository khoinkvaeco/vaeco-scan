<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tra ảnh VAECO</title>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
  :root{--bg:#f3f5f7;--panel:#fff;--ink:#14202b;--muted:#5d6b78;--line:#d6dde3;--accent:#0b5fa5;--accent-ink:#fff;--ok:#1d7a46;--err:#b42318;--warn:#9a6700;--mono:ui-monospace,Menlo,Consolas,monospace;color-scheme:light}
  @media (prefers-color-scheme:dark){:root{--bg:#0f151b;--panel:#17212a;--ink:#e6edf3;--muted:#93a1ae;--line:#2a3743;--accent:#4ea1e6;--accent-ink:#06121c;--ok:#4cc38a;--err:#ff7b72;--warn:#e3b341;color-scheme:dark}}
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,Roboto,Arial,sans-serif}
  main{max-width:640px;margin:0 auto;padding:12px 16px 24px;display:grid;gap:10px}
  h1{font-size:18px;margin:0}
  h1 small{display:block;font-size:12px;font-weight:400;color:var(--muted)}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;display:grid;gap:10px}
  button,.btn{font:inherit;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;padding:10px 14px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
  .primary{background:var(--accent)!important;border-color:var(--accent)!important;color:var(--accent-ink)!important;font-weight:600}
  .row{display:flex;gap:8px;flex-wrap:wrap}
  .row>*{flex:1 1 auto}
  input[type=text]{font:inherit;font-family:var(--mono);text-transform:uppercase;width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);min-width:0}
  #reader{width:100%;border-radius:8px;overflow:hidden;background:#000}
  .status{font-size:14px;padding:8px 10px;border-radius:8px;background:var(--bg);border:1px solid var(--line)}
  .ok{color:var(--ok)}.err{color:var(--err)}.warn{color:var(--warn)}
  .code{font-family:var(--mono);font-weight:700;font-size:20px}
  .meta{color:var(--muted);font-size:13px}
  #photo{width:100%;border-radius:8px;background:var(--bg);display:block;min-height:120px}
  .chips{display:flex;gap:6px;flex-wrap:wrap}
  .chip{font-family:var(--mono);font-size:12px;padding:6px 8px}
  .chip[aria-current=true]{border-color:var(--accent);color:var(--accent);font-weight:700}
  .stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .stat{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
  .stat b{display:block;font-size:24px;font-variant-numeric:tabular-nums;line-height:1.2}
  .stat span{font-size:12px;color:var(--muted)}
  .stat.main b{color:var(--accent)}
  details summary{cursor:pointer;font-size:13px;color:var(--muted)}
  #code-list{max-height:240px;overflow:auto;margin-top:8px}
</style>
</head>
<body>
<main>
  <h1>Tra ảnh theo mã thẻ<small>Quét QR / barcode VAEC0-xxxx</small></h1>

  <section class="panel">
    <div class="stats">
      <div class="stat main"><b id="s-cards">…</b><span>Thẻ đang trong công ty</span></div>
      <div class="stat"><b id="s-images">…</b><span>Ảnh trong thư mục</span></div>
    </div>
    <div class="row" style="align-items:center">
      <span id="s-meta" class="meta">Đang đếm…</span>
      <button id="btn-refresh" type="button" style="flex:0 0 auto">Làm mới</button>
    </div>
    <details id="list-box">
      <summary>Danh sách mã thẻ</summary>
      <input id="list-filter" type="text" placeholder="Lọc mã…" autocomplete="off" style="margin-top:8px">
      <div id="code-list" class="chips"></div>
    </details>
  </section>

  <section class="panel">
    <div class="row">
      <button id="btn-cam" class="primary" type="button">Mở camera quét</button>
      <label class="btn" style="flex:0 1 auto">Chụp ảnh mã
        <input id="file-input" type="file" accept="image/*" capture="environment" hidden>
      </label>
    </div>
    <div id="reader" hidden></div>
    <div id="reader-file" hidden></div>
    <form id="manual" class="row">
      <input id="code-input" type="text" placeholder="Nhập tay: VAEC0-2B0014" autocomplete="off" style="flex:1 1 160px">
      <button type="submit" style="flex:0 0 auto">Tìm</button>
    </form>
    <div id="status" class="status">Bấm "Mở camera quét" hoặc nhập mã.</div>
  </section>

  <section id="result" class="panel" hidden>
    <div class="row" style="align-items:baseline">
      <span id="r-code" class="code"></span>
      <span id="r-count" class="meta" style="text-align:right"></span>
    </div>
    <a id="r-full" target="_blank" rel="noopener"><img id="photo" alt="Ảnh theo mã"></a>
    <div id="r-meta" class="meta"></div>
    <div id="chips" class="chips"></div>
    <div class="row">
      <a id="r-drive" class="btn" target="_blank" rel="noopener">Mở trên Drive</a>
      <button id="btn-next" class="primary" type="button">Quét mã tiếp</button>
    </div>
  </section>
</main>

<script>
// ====== CẤU HÌNH: chỉ cần sửa 2 dòng này ======
const API_KEY   = 'AIzaSyBz8Zg_cqz-qu3PbiiDBrRI-bfbx5of7-0';
const FOLDER_ID = '1tFHCwI826iLgvOwq6lep1phwi81OsV-9';
// ==============================================

const $ = id => document.getElementById(id);
const DRIVE = 'https://www.googleapis.com/drive/v3/files';

function setStatus(msg, kind){
  const s = $('status');
  s.className = 'status' + (kind ? ' ' + kind : '');
  s.textContent = msg;
}

// Đọc mã: chấp nhận VAEC0-xxxx (số 0) và VAECO-xxxx (chữ O),
// dấu gạch thường/dài hoặc khoảng trắng. Nhập tay có thể bỏ tiền tố.
function parseCode(raw, allowBare){
  const t = String(raw || '').trim();
  const m = t.match(/VAEC[O0]\s*[-–—_\s]\s*([A-Za-z0-9]+)/i);
  if (m) return m[1].toLowerCase();
  if (allowBare && /^[A-Za-z0-9]+$/.test(t)) return t.toLowerCase();
  return null;
}
const label = code => 'VAEC0-' + code.toUpperCase();

function shotTime(name){
  const m = name.match(/-(\d{2})(\d{2})(\d{2})(\d{2})(\d{2})\./);
  return m ? m[2] + '/' + m[1] + ' ' + m[3] + ':' + m[4] + ':' + m[5] : '';
}

async function driveList(q, fields, pageToken){
  const p = { q: q, key: API_KEY, pageSize: '1000', fields: fields, orderBy: 'modifiedTime desc' };
  if (pageToken) p.pageToken = pageToken;
  const r = await fetch(DRIVE + '?' + new URLSearchParams(p));
  const j = await r.json();
  if (!r.ok) throw new Error((j.error && j.error.message) || ('Lỗi ' + r.status));
  return j;
}
const baseQ = "'" + FOLDER_ID + "' in parents and trashed = false and mimeType contains 'image/'";

async function findFiles(code){
  const j = await driveList(baseQ + " and name contains '" + code + "'", 'files(id,name,size,modifiedTime)');
  return (j.files || []).filter(f => f.name.toLowerCase().startsWith(code + '-'));
}
const imgUrl  = id => DRIVE + '/' + id + '?alt=media&key=' + API_KEY;
const imgUrl2 = id => 'https://lh3.googleusercontent.com/d/' + id + '=w2000';
const viewUrl = id => 'https://drive.google.com/file/d/' + id + '/view';

// ---------- Thống kê ----------
let allCodes = [];
async function loadStats(){
  $('s-meta').textContent = 'Đang đếm…';
  try {
    let token = '', files = [];
    do {
      const j = await driveList(baseQ, 'nextPageToken,files(name)', token);
      files = files.concat(j.files || []);
      token = j.nextPageToken || '';
    } while (token);

    const counts = {};
    files.forEach(f => {
      const i = f.name.indexOf('-');
      if (i > 0) { const c = f.name.slice(0, i).toLowerCase(); counts[c] = (counts[c] || 0) + 1; }
    });
    allCodes = Object.keys(counts).sort();
    const multi = allCodes.filter(c => counts[c] > 1).length;

    $('s-images').textContent = files.length.toLocaleString('vi-VN');
    $('s-cards').textContent = allCodes.length.toLocaleString('vi-VN');
    const now = new Date();
    $('s-meta').textContent = 'Cập nhật ' + now.toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit' }) +
      (multi ? ' · ' + multi + ' thẻ có nhiều hơn 1 ảnh' : '');
    renderList();
  } catch (e) {
    $('s-cards').textContent = '–'; $('s-images').textContent = '–';
    $('s-meta').textContent = 'Không đếm được: ' + e.message;
  }
}
function renderList(){
  const f = $('list-filter').value.trim().toLowerCase();
  const box = $('code-list'); box.innerHTML = '';
  allCodes.filter(c => !f || c.includes(f)).forEach(c => {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'chip';
    b.textContent = c.toUpperCase();
    b.onclick = () => { stopCam(); lookup(c); };
    box.append(b);
  });
}
$('list-filter').oninput = renderList;
$('btn-refresh').onclick = loadStats;

// ---------- Camera ----------
let scanner = null, fileScanner = null, scanning = false, busy = false;
const fmts = () => Object.values(Html5QrcodeSupportedFormats).filter(v => typeof v === 'number');
const opts = () => ({ verbose: false, formatsToSupport: fmts(), experimentalFeatures: { useBarCodeDetectorIfSupported: true } });

async function startCam(){
  if (scanning) return;
  $('result').hidden = true;
  $('reader').hidden = false;
  try {
    setStatus('Đang mở camera…');
    if (!scanner) scanner = new Html5Qrcode('reader', opts());
    await scanner.start({ facingMode: 'environment' },
      { fps: 10, qrbox: (w, h) => { const s = Math.floor(Math.min(w, h) * 0.75); return { width: s, height: Math.floor(s * 0.6) }; } },
      onDecoded, () => {});
    scanning = true;
    $('btn-cam').textContent = 'Tắt camera';
    setStatus('Đưa mã vào khung để quét.');
  } catch (e) {
    $('reader').hidden = true;
    setStatus('Không mở được camera. Kiểm tra quyền camera của trình duyệt, hoặc dùng "Chụp ảnh mã".', 'warn');
  }
}
async function stopCam(){
  if (scanning) { try { await scanner.stop(); } catch (e) {} }
  scanning = false;
  $('reader').hidden = true;
  $('btn-cam').textContent = 'Mở camera quét';
}
$('btn-cam').onclick = () => scanning ? stopCam().then(() => setStatus('Đã tắt camera.')) : startCam();

function onDecoded(text){
  if (busy) return;
  const code = parseCode(text, false);
  if (!code) return setStatus('Mã không đúng dạng VAEC0-xxxx: ' + text, 'warn');
  if (navigator.vibrate) navigator.vibrate(80);
  stopCam();
  lookup(code);
}

$('file-input').onchange = async e => {
  const f = e.target.files[0]; e.target.value = '';
  if (!f) return;
  await stopCam();
  setStatus('Đang đọc mã từ ảnh…');
  try {
    if (!fileScanner) fileScanner = new Html5Qrcode('reader-file', opts());
    const text = await fileScanner.scanFile(f, false);
    const code = parseCode(text, false);
    if (!code) return setStatus('Mã trong ảnh không đúng dạng VAEC0-xxxx: ' + text, 'warn');
    lookup(code);
  } catch (err) {
    setStatus('Không đọc được mã trong ảnh. Chụp gần, đủ sáng, mã nằm thẳng.', 'err');
  }
};

$('manual').onsubmit = e => {
  e.preventDefault();
  const code = parseCode($('code-input').value, true);
  if (!code) return setStatus('Mã nhập không hợp lệ.', 'warn');
  stopCam(); lookup(code);
};

// ---------- Tra cứu + hiển thị ----------
let current = [];
async function lookup(code){
  busy = true;
  $('code-input').value = label(code);
  setStatus('Đang tìm ảnh cho ' + label(code) + '…');
  try {
    current = await findFiles(code);
    if (!current.length) {
      $('result').hidden = true;
      return setStatus('Không có ảnh cho ' + label(code) + ' (thẻ không có trong thư mục).', 'err');
    }
    $('r-code').textContent = label(code);
    $('r-count').textContent = current.length > 1 ? current.length + ' ảnh, đang xem mới nhất' : '1 ảnh';
    showImage(0);
  } catch (e) {
    setStatus('Lỗi: ' + e.message, 'err');
  } finally { busy = false; }
}

function showImage(i){
  const f = current[i];
  $('result').hidden = false;
  $('r-drive').href = viewUrl(f.id);
  $('r-full').href = imgUrl(f.id);
  $('r-meta').textContent = f.name + (shotTime(f.name) ? ' · chụp ' + shotTime(f.name) : '') + ' · ' + Math.round((f.size || 0) / 1024) + ' KB';
  const img = $('photo');
  img.onerror = () => {
    if (img.dataset.fb !== '1') { img.dataset.fb = '1'; img.src = imgUrl2(f.id); }
    else setStatus('Không tải được ảnh. Kiểm tra thư mục đã chia sẻ "Bất kỳ ai có đường liên kết".', 'err');
  };
  img.onload = () => setStatus('Đã mở ảnh ' + f.name, 'ok');
  img.dataset.fb = '0';
  img.src = imgUrl(f.id);
  setStatus('Đang tải ảnh…');

  const box = $('chips'); box.innerHTML = '';
  if (current.length > 1) current.forEach((x, k) => {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'chip';
    b.textContent = shotTime(x.name) || x.name;
    b.setAttribute('aria-current', k === i);
    b.onclick = () => showImage(k);
    box.append(b);
  });
  $('result').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

$('btn-next').onclick = () => { window.scrollTo({ top: 0 }); startCam(); };

if (API_KEY.indexOf('DAN_') === 0) {
  setStatus('Chưa cấu hình API_KEY trong file.', 'err');
  $('s-meta').textContent = 'Chưa có API key.';
} else {
  loadStats();
}
</script>
</body>
</html>
